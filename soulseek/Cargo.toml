[package]
name = "player-soulseek-plugin"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["ffi"]
ffi = []

[dependencies]
player-plugin-sdk.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util"] }
soulseek_rs = { package = "soulseek-rs-lib", path = "vendor/soulseek-rs-lib", features = ["tracing"] }

[dev-dependencies]
player-plugin-sdk = { workspace = true, features = ["testing"] }
